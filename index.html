<style>
:root{
  --bg:#f4f7fa; --card:#fff; --text:#222; --muted:#666;
  --primary:#008cba; --accent:#00bcd4; --glass: rgba(255,255,255,0.6);
}
:root.dark{
  --bg:#0f1720; --card:#0b1220; --text:#e6eef6; --muted:#9fb0c4;
  --primary:#0ea5b7; --accent:#22d3ee; --glass: rgba(15,23,32,0.6);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter, "Segoe UI", Arial, sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  color: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

/* Title + Subtitle on one line */
.header-left {
  display: flex;
  align-items: baseline;
  gap: 10px; /* Title & subtitle ke beech space */
}

#dashboardTitle {
  color: #ffffff;
  font-size: 22px;
  font-weight: 700;
  text-shadow: 0 1px 4px rgba(0,0,0,0.25);
}

#dashboardSubtitle {
  color: #d1faff;
  font-weight: 500;
  font-size: 15px;
  opacity: 0.9;
}

/* Right side buttons */
.header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-right: 15px; /* thoda andar right side */
}

.switch {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--glass);
  padding: 6px 12px;
  border-radius: 999px;
  color: #fff;
  font-weight: 700;
}

.btn {
  border: none;
  padding: 8px 14px;
  border-radius: 10px;
  background: #fff;
  color: var(--primary);
  cursor: pointer;
  font-weight: 700;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
  transition: all 0.2s ease;
}
.btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.12);
}


.header-left{display:flex;align-items:center;gap:12px}
.header-title{display:flex;flex-direction:column}
.header-sub{font-size:12px;opacity:0.95}
.header-actions{display:flex;align-items:center;gap:10px}

/* Toggle */
.switch{
  display:inline-flex;align-items:center;gap:8px;background:var(--glass);padding:6px;border-radius:999px;color:#fff;font-weight:700;
}
.btn{
  border:none;padding:8px 12px;border-radius:10px;background:#fff;color:var(--primary);cursor:pointer;font-weight:700;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
}
.btn.ghost{background:transparent;color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,0.08)}

/* Container */
.container{max-width:1200px;margin:18px auto;padding:12px}

/* Tabs + search */
.tabs-search-container { display:flex; gap:10px; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap: wrap; }
.tabs { display:flex; gap:10px; overflow-x:auto;padding-top:4px; }
.tabs button {
  padding: 10px 12px;
  border: none;
  border-radius: 14px;
  background: #e3eaf0;
  cursor: pointer;
  white-space: nowrap;
  font-size: 18px;
  font-weight: 600;
  color: #333;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.3s ease;
  letter-spacing: 0.5px;
}
.tabs button span.emoji { font-size: 28px; display: inline-block; transition: transform 0.3s ease; }
.tabs button:hover { background: #b3d4fc; color: #000; transform: translateY(-3px); }
.tabs button.active { background: linear-gradient(135deg, #008cba, #00bcd4); color: #fff; font-size: 24px; font-weight: 700; box-shadow: 0 6px 16px rgba(0,0,0,0.2); }
.tabs button.active span.emoji { transform: scale(1.3); }
.tabs::-webkit-scrollbar { display:none; }
.search-box{display:flex;gap:8px;align-items:center}
.search-box input{padding:10px 14px;border-radius:14px;border:2px solid var(--primary);width:200px;font-weight:700}

/* Card view toggle */
.controls{display:flex;gap:8px;align-items:center}

/* Tab content area */
.tab-content{display:none;background:var(--card);padding:12px;border-radius:10px;box-shadow:0 6px 24px rgba(2,6,23,0.06);min-height:220px;opacity:0;transform:translateY(6px);transition:opacity .28s ease,transform .28s ease}

.spinner{width:36px;height:36px;border-radius:50%;border:4px solid rgba(0,0,0,0.08);border-top-color:var(--primary);animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Table tweaks */

table.dataTable thead th{
position: sticky;
top: 0;
background: var(--card);
z-index: 10;

.dataTables_wrapper{

/* responsive */
@media (max-width:760px){

  div.dataTables_wrapper{
    overflow-x:auto;
    -webkit-overflow-scrolling: touch;
  }

  table.dataTable{
    width:100% !important;

/* small animation for table rows when updated */
.row-flash{animation:flash .9s ease}
@keyframes flash{0%{background:rgba(255,241,204,0.95)}100%{background:transparent}}


/* ===== Mobile: allow header wrap but keep all data single line ===== */
@media (max-width: 760px) {

body.cards-on #searchAll{display:block}
@media (min-width:761px){#cardToggle{display:none}}
@media (max-width:760px){
  header{padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;gap:8px}
  .header-left{min-width:0;flex:1;flex-direction:column;align-items:flex-start;gap:0}

  .container{margin:0;padding:8px}
  .tabs-search-container{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -8px 8px;padding:8px;gap:8px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .tabs{width:100%;gap:8px;-webkit-overflow-scrolling:touch}
  .tabs button{flex:none;padding:8px 12px;font-size:14px;border-radius:12px}
  .tabs button.active{font-size:14px}
  .tabs button span.emoji{font-size:18px}
  .tabs button.active span.emoji{transform:none}

  .controls{width:100%}
  .search-box{width:100%;flex-wrap:wrap}
  .search-box input{flex:1 1 40%;min-width:0;width:auto;padding:9px 12px;font-size:16px;border-radius:12px}

  .tab-content{padding:8px}
  .dataTables_wrapper .dataTables_length{display:none}

}

/* ===== v105: mobile auto-fit columns, single-line data ===== */
@media (max-width:760px){
  div.dataTables_wrapper{overflow-x:auto!important;-webkit-overflow-scrolling:touch}
  table.dataTable{width:auto!important;min-width:100%;table-layout:auto;margin:0!important;font-size:11.5px}

<!-- JS libs (defer = parallel download, no render blocking) -->
<script defer src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script defer src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script>
let deferredPrompt = null;

// Install event capture
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
});

// Install button click
document.addEventListener("click", async (e) => {

if (e.target.id === "installBtn") {

  if (!deferredPrompt) {
    alert("Install option not available yet");
    return;
  }

  deferredPrompt.prompt();

  const { outcome } = await deferredPrompt.userChoice;

  console.log("Install result:", outcome);

  // ✅ YE LINE ADD KARO (MOST IMPORTANT)
  if (outcome === "accepted") {
    localStorage.setItem("appInstalled", "yes");
  }

  deferredPrompt = null;

  closeInstallPopup();
}

});

// Close popup
function closeInstallPopup(){
  document.getElementById("installPopup").style.display = "none";
}


function isAppInstalled() {
  return window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true
    || document.referrer.includes('android-app://');
}


function showFirstTimePopup() {

  console.log("Popup check running");

  // ✅ Installed → popup band
  if (isAppInstalled() || localStorage.getItem("appInstalled") === "yes") {
    console.log("🚫 Popup blocked (installed)");
    return;
  }

  const lastShown = localStorage.getItem("popupTime");
  const now = Date.now();

  if (!lastShown || (now - lastShown) > 86400000) { // 24 hours
    document.getElementById("installPopup").style.display = "flex";
    localStorage.setItem("popupTime", now);
  }
}


window.addEventListener('appinstalled', () => {
  console.log('🎉 App Installed');

  localStorage.setItem("appInstalled", "yes");

  document.getElementById("installPopup").style.display = "none";
});

window.addEventListener("DOMContentLoaded", () => {
  setTimeout(() => {
    showFirstTimePopup();
  }, 1500); // slight delay = more reliable
});


</script>

<script>
window.addEventListener('DOMContentLoaded', () => {
const SHEET_ID = "1-rBhct0Xohot_KX6bL4M9TQJ8QpzmtzEUexW4xHn2GI";
const OPEN = s => `https://opensheet.elk.sh/${SHEET_ID}/${encodeURIComponent(s)}`;
const CACHE_TTL = 3600000, LIVE_MS = 30000, TIMEOUT = 12000;
const CONFIG = {SHEETS:[], TITLE:"📊 Transport Dashboard", SUBTITLE:"Freight Dashboard", DEFAULT_MODE:"dark", ICONS:{}, PAGE_LENGTH:10};
const tables={}, rawStr={}, sigs={}, inflight={}, shown={};
let currentTab=null;
const useCards=false; // card view removed
const isMobile=()=>window.innerWidth<=760;
const cardsActive=()=>isMobile() && useCards;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const debounce=(fn,w=220)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),w)}};
const tf=u=>{const c=new AbortController();const t=setTimeout(()=>c.abort(),TIMEOUT);return fetch(u,{signal:c.signal}).finally(()=>clearTimeout(t))};
const cKey=n=>'sheet_cache__'+n;
const saveC=(n,d)=>{try{localStorage.setItem(cKey(n),JSON.stringify({ts:Date.now(),data:d}))}catch(e){}};
const loadC=n=>{try{const o=JSON.parse(localStorage.getItem(cKey(n)));return o&&Date.now()-o.ts<CACHE_TTL?o.data:null}catch(e){return null}};

/* ===== Settings (cached → instant on repeat visits) ===== */
function applySettings(rows){
  (rows||[]).forEach(r=>{
    if(!r.Key||!r.Value) return;
    if(r.Key.startsWith('ICON_')) CONFIG.ICONS[r.Key.slice(5)]=r.Value;
    else if(r.Key==='SHEETS') CONFIG.SHEETS=r.Value.split(',').map(x=>x.trim()).filter(Boolean);
    else CONFIG[r.Key]=r.Value;
  });
  $('#dashboardTitle').text(CONFIG.TITLE||'📊 Dashboard');
  $('#dashboardSubtitle').text(CONFIG.SUBTITLE||'');
}
async function loadSettings(){
  let cached=null; try{cached=JSON.parse(localStorage.getItem('settings_cache'))}catch(e){}
  const fresh=window.__settingsP||Promise.resolve(null);
  const save=d=>{if(Array.isArray(d)){try{localStorage.setItem('settings_cache',JSON.stringify(d))}catch(e){}return true}return false};
  if(Array.isArray(cached)){ applySettings(cached); fresh.then(d=>{if(save(d))applySettings(d)}); }
  else { const d=await fresh; if(save(d)) applySettings(d); else $('#dashboardSubtitle').text('⚠ Settings not found'); }
}

/* ===== Data helpers ===== */
function norm(arr){
  if(!Array.isArray(arr)||!arr.length) return {rows:[],keys:[]};
  const keys=Object.keys(arr[0]).filter(k=>k&&k.trim()!=='');
  return {keys, rows:arr.map(r=>{const o={};keys.forEach(k=>o[k]=r[k]??'');return o})};
}
function enhance(rows,keys){
  const rk=keys.find(k=>['remark','wk'].includes(k.trim().toLowerCase()));
  return rows.map(r=>({...r,__priority: rk&&String(r[rk]||'').trim()!==''?1:0}));
}
function buildGeneric($t,rows,keys,tabId){
  if($.fn.DataTable.isDataTable($t)) $t.DataTable().destroy();
  $t.empty().show();
  const dt=$t.DataTable({
    deferRender:true, pagingType:'simple', data:enhance(rows,keys),
    columns:[{data:'__priority',visible:false},...keys.map(k=>({title:k,data:k}))],
    orderMulti:false, orderFixed:{pre:[[0,'desc']]}, order:[[1,'asc']],
    pageLength:parseInt(CONFIG.PAGE_LENGTH)||10,
    responsive:false, scrollX:!isMobile(), autoWidth:false,
    createdRow:(row,d)=>{ if(d.__priority===1) $(row).addClass('prio-row'); }
  });
  tables[tabId]=dt; dt.on('draw.dt',()=>autoFit(tabId));
}
function updateGeneric(dt,rows,keys){ dt.clear(); dt.rows.add(enhance(rows,keys)); dt.draw(false); }
function buildCalc($t,rows,keys,tabId){
  if($.fn.DataTable.isDataTable($t)) try{$t.DataTable().destroy()}catch(e){}
  $t.empty().show();
  const nk=keys.slice(0,4), hk=keys.slice(4,8), $th=$('<thead/>');
  $th.append(`<tr><th class="normal-route" colspan="${nk.length}">Normal Route</th><th class="hilly-route" colspan="${hk.length}">Hilly / Ghat Route</th></tr>`);
  const hr=$('<tr/>');
  nk.forEach(k=>hr.append(`<th class="normal-route">${esc(k)}</th>`));
  hk.forEach(k=>hr.append(`<th class="hilly-route">${esc(k)}</th>`));
  $th.append(hr); $t.append($th);
  tables[tabId]=$t.DataTable({data:rows,columns:keys.map(k=>({title:k,data:k})),destroy:true,responsive:!isMobile(),pageLength:15,order:[[5,'asc']],
    createdRow:row=>{$(row).find('td:lt(4)').addClass('normal-route');$(row).find('td:gt(3)').addClass('hilly-route')}});
  tables[tabId].on('draw.dt',()=>autoFit(tabId));
}

/* ===== Apply data (only touches DOM when data really changed) ===== */
function applyData(sheet,data,flash){
  if(!Array.isArray(data)) return false;
  const str=JSON.stringify(data); if(str===rawStr[sheet]) return false;
  const tabId='table_'+sheet.toLowerCase(), $t=$('#'+tabId), had=rawStr[sheet]!==undefined;
  const {rows,keys}=norm(data), sig=keys.join('|');
  rawStr[sheet]=str;
  if(!keys.length){ $('#'+tabId+'_placeholder').html('<div class="placeholder">No data</div>').show(); return true; }
  $t.toggleClass('nowrap',!isMobile());
  if(sheet==='Calculation') buildCalc($t,rows,keys,tabId);
  else if(tables[tabId]&&sigs[tabId]===sig) updateGeneric(tables[tabId],rows,keys);
  else buildGeneric($t,rows,keys,tabId);
  sigs[tabId]=sig;
  $('#'+tabId+'_placeholder').hide();
  applyView(tabId,true);
  if(flash&&had){ const n=$(tables[tabId].rows().nodes()); n.addClass('row-flash'); setTimeout(()=>n.removeClass('row-flash'),1000); }
  return true;
}
async function fetchSheet(sheet,bust){
  if(inflight[sheet]) return true; inflight[sheet]=1;
  try{
    const r=await tf(OPEN(sheet)+(bust?'?_='+Date.now():'')); const d=await r.json();
    if(!Array.isArray(d)) throw new Error('bad response');
    if(applyData(sheet,d,true)) saveC(sheet,d);
    return true;
  }catch(e){ console.warn('fetch failed',sheet,e); return false; }
  finally{ inflight[sheet]=0; }
}
async function loadSheet(sheet){
  const c=loadC(sheet); if(c) applyData(sheet,c,false);
  const ok=await fetchSheet(sheet,false);
  if(!ok&&!c) $('#table_'+sheet.toLowerCase()+'_placeholder').html(`<div style="color:var(--muted)">⚠ Unable to load ${esc(sheet)}. Please check network or sheet.</div>`);
}

/* ===== Card view (mobile) – follows table search / sort / filters ===== */
const findCol=(keys,name)=>{let i=keys.findIndex(k=>k.trim().toLowerCase()===name);return i>=0?i:keys.findIndex(k=>k.toLowerCase().includes(name))};
function renderCards(tabId,keep){
  const el=document.getElementById(tabId+'_cards'), dt=tables[tabId]; if(!el||!dt) return;
  if(!keep) shown[tabId]=30;
  const sheet=$('#'+tabId+'_container').data('sheet');
  const rows=dt.rows({search:'applied',order:'applied'}).data().toArray();
  if(!rows.length){ el.innerHTML='<div class="placeholder">No data</div>'; return; }
  const keys=Object.keys(rows[0]).filter(k=>!k.startsWith('__'));
  const fi=findCol(keys,'from'), ti=findCol(keys,'to'), ft=fi>=0&&ti>=0&&fi!==ti&&sheet!=='Calculation';
  const card=r=>{
    const title=ft?`${esc(r[keys[fi]])} → ${esc(r[keys[ti]])}`:esc(r[keys[0]]);
    const f=keys.map((k,i)=>({k,i})).filter(o=>(ft?(o.i!==fi&&o.i!==ti):o.i!==0)&&String(r[o.k]??'').trim()!=='');
    const grp=sheet==='Calculation'?(i=>i<4?' n':' h'):()=>'';
    return `<div class="mcard${r.__priority===1?' prio':''}"><h4>${title}</h4><div class="fgrid">`+
      f.map(o=>`<div class="fld${String(r[o.k]).length>28?' wide':''}${grp(o.i)}"><span>${esc(o.k)}</span><b>${esc(r[o.k])}</b></div>`).join('')+`</div></div>`;
  };
  const n=shown[tabId]||30;
  el.innerHTML=`<div class="cnt">${rows.length} results</div>`+rows.slice(0,n).map(card).join('')+
    (rows.length>n?`<button class="btn more-btn" data-t="${tabId}">Show more (${rows.length-n} left)</button>`:'');
}
$(document).on('click','.more-btn',function(){const t=$(this).data('t');shown[t]=(shown[t]||30)+30;renderCards(t,true)});

/* Mobile auto-fit: columns size to content (single line); if still wider than screen, shrink font until it fits */
function autoFit(tabId){
  if(!isMobile()) return;
  const dt=tables[tabId]; if(!dt) return;
  const tbl=dt.table().node(), box=dt.table().container();
  if(!tbl.offsetParent) return;
  tbl.style.fontSize='';
  let fs=parseFloat(getComputedStyle(tbl).fontSize);
  for(let i=0;i<4&&tbl.offsetWidth>box.clientWidth+1&&fs>8.5;i++){
    fs=Math.max(8.5,fs*box.clientWidth/tbl.offsetWidth-0.2);
    tbl.style.fontSize=fs+'px';
  }
}
function applyView(tabId,keep){
  const on=cardsActive();
  document.body.classList.toggle('cards-on',on);
  const $w=$('#'+tabId).closest('.dataTables_wrapper'), w=$w.length?$w:$('#'+tabId);
  if(on){ w.css('display','none'); $('#'+tabId+'_cards').css('display','flex'); renderCards(tabId,keep); }
  else { $('#'+tabId+'_cards').css('display','none'); w.css('display',''); if(tables[tabId]){ tables[tabId].columns.adjust(); autoFit(tabId); } }
}

/* ===== FROM / TO / ALL filters ===== */
function colIdx(dt,name){const cols=dt.settings().init().columns||[];let i=cols.findIndex(c=>(c.title||'').trim().toLowerCase()===name);return i>=0?i:cols.findIndex(c=>(c.title||'').toLowerCase().includes(name))}
function applyFilters(){
  const dt=tables[currentTab]; if(!dt) return;
  dt.columns().search('');
  const i=colIdx(dt,'from'), j=colIdx(dt,'to');
  if(i>=0) dt.column(i).search($('#searchFrom').val().trim());
  if(j>=0) dt.column(j).search($('#searchTo').val().trim());
  if(cardsActive()) dt.search($('#searchAll').val().trim());
  dt.draw();
  if(cardsActive()) renderCards(currentTab);
}
$('#searchFrom,#searchTo,#searchAll').on('input',debounce(applyFilters));
function updateSearchBox(){
  const ft=!!currentTab&&/tanker|truck|others/.test(currentTab);
  $('#searchFrom,#searchTo').toggle(ft);
  $('#searchBox').css('display',(ft||cardsActive())?'flex':'none');
  $('#searchFrom,#searchTo,#searchAll').val('');
}
function setMode(dark){
  document.documentElement.classList.toggle('dark',dark);
  localStorage.setItem('ui_mode',dark?'dark':'light');
  $('#modeLabel').text(dark?'Dark':'Light');
}
function rebuildAll(){
  Object.keys(tables).forEach(tabId=>{
    const sheet=$('#'+tabId+'_container').data('sheet'), str=rawStr[sheet]; if(!str) return;
    delete tables[tabId]; delete sigs[tabId]; delete rawStr[sheet];
    applyData(sheet,JSON.parse(str),false);
  });
}
const setToggleLabel=()=>$('#cardToggle').text(useCards?'Table View':'Card View');

/* ===== UI ===== */
async function initUI(){
  const tabsC=$('#tabsContainer'), tabsB=$('#tabsContent');
  let names=CONFIG.SHEETS.slice();
  if(!names.length){
    try{ const r=await tf(OPEN('Index')); const d=await r.json(); names=Array.isArray(d)?d.map(x=>x.SheetName).filter(Boolean):[]; }catch(e){}
  }
  if(!names.length) names=['Calculation','Tanker','Truck','Tempo','Others'];
  names.forEach(sheet=>{
    const id='table_'+sheet.toLowerCase();
    const emoji=(CONFIG.ICONS&&CONFIG.ICONS[sheet])||(sheet==='Calculation'?'🧮':sheet==='Tanker'?'🚛':sheet==='Truck'?'🚚':sheet==='Tempo'?'🛻':'📦');
    tabsC.append(`<button class="tab-btn" data-tab="${id}"><span class="emoji">${emoji}</span> ${esc(sheet)}</button>`);
    tabsB.append(`<div id="${id}_container" class="tab-content" data-sheet="${esc(sheet)}">
      <div id="${id}_placeholder" class="placeholder"><div style="text-align:center"><div class="spinner"></div><div style="margin-top:10px;color:var(--muted)">Loading ${esc(sheet)}...</div></div></div>
      <div id="${id}_cards" class="card-list"></div>
      <table id="${id}" class="display" style="width:100%;display:none"></table></div>`);
  });
  $('.tab-btn').first().addClass('active'); $('.tab-content').first().addClass('active');
  currentTab=$('.tab-btn').first().data('tab');
  setMode((localStorage.getItem('ui_mode')||CONFIG.DEFAULT_MODE||'dark')==='dark');
  setToggleLabel(); updateSearchBox();

  $('.tab-btn').on('click',function(){
    $('.tab-btn').removeClass('active'); $(this).addClass('active');
    $('.tab-content').removeClass('active');
    const id=$(this).data('tab'); $('#'+id+'_container').addClass('active');
    currentTab=id;
    const sheet=$('#'+id+'_container').data('sheet');
    if(rawStr[sheet]===undefined&&!inflight[sheet]) loadSheet(sheet);
    updateSearchBox(); applyView(id); applyFilters();
    this.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  });
  $('#modeToggle').on('click',()=>setMode(localStorage.getItem('ui_mode')!=='dark'));
  let lastMobile=isMobile();
  window.addEventListener('resize',debounce(()=>{
    if(isMobile()===lastMobile) return; lastMobile=isMobile();
    rebuildAll();
    updateSearchBox(); applyView(currentTab);
  },150));

  const first=names[0];
  await loadSheet(first);
  if(names.includes('Tanker')&&first!=='Tanker') loadSheet('Tanker');
}

/* ===== Live refresh: only visible tab, only when page is open ===== */
function liveRefresh(){
  if(document.hidden||!currentTab) return;
  const sheet=$('#'+currentTab+'_container').data('sheet');
  if(sheet&&rawStr[sheet]!==undefined) fetchSheet(sheet,true);
}
setInterval(liveRefresh,LIVE_MS);
document.addEventListener('visibilitychange',liveRefresh);

loadSettings().then(initUI);
});
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
